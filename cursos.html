<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conheça os cursos avaliados pelo teste Vocação Polar.">
  <link rel="icon" href="assets/img/Teste-vocacional.ico">
  <link rel="stylesheet" href="assets/css/main.css">
  <title>Cursos — Vocação Polar</title>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div data-site-header></div>

    <section class="section" style="padding-top:20px">
      <div class="course-toolbar" data-reveal><div class="search-box"><input id="course-search" type="search" placeholder="Buscar curso ou habilidade…" aria-label="Buscar cursos"></div><span id="course-count" class="course-count"></span></div>

    <section class="cta-panel" data-reveal><div><h2>Ainda está em dúvida?</h2><p>Faça o teste e compare sua afinidade relativa com todos esses cursos.</p></div><a class="button button-lg" href="teste.html">Descobrir afinidades</a></section>
  </main>
  <div data-site-footer></div>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/test-data.js"></script>
  <script src="assets/js/catalog.js"></script>
